name: personal_safety_app
description: A production-grade personal safety app built with Flutter, Firebase, Riverpod, and Cloud Functions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_storage: ^12.0.0
  geolocator: ^11.0.0
  flutter_background_service: ^5.0.5
  workmanager: ^0.10.0
  speech_to_text: ^7.0.0
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.1
  cupertino_icons: ^1.0.8
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  permission_handler: ^11.3.1
  http: ^1.2.2
  intl: ^0.19.0
  google_sign_in: ^6.2.1
  sensors_plus: ^6.0.1
  flutter_sound: ^9.14.6
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
